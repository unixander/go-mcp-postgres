default:
  image: golang:1.26-alpine

variables:
  CGO_ENABLED: "0"
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOLANGCI_LINT_VERSION: "v2.1.6"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/go/pkg/mod
    - .cache/golangci-lint

stages:
  - verify
  - test
  - build
  - release

# ── verify ────────────────────────────────────────────────────────────────────

vet:
  stage: verify
  script:
    - go vet ./...

lint:
  stage: verify
  before_script:
    - apk add --no-cache curl
    - mkdir -p .cache/golangci-lint
    - |
      curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
        | sh -s -- -b .cache/golangci-lint ${GOLANGCI_LINT_VERSION}
  script:
    - .cache/golangci-lint/golangci-lint run ./...

tidy:
  stage: verify
  script:
    - go mod tidy
    - |
      if ! git diff --exit-code go.mod go.sum; then
        echo "go.mod/go.sum are not tidy — run 'go mod tidy' and commit the result"
        exit 1
      fi

# ── test ──────────────────────────────────────────────────────────────────────

unit:
  stage: test
  script:
    - go test ./test/... -run "TestConfig|TestResolver" -v -count=1 -timeout 30s

integration:
  stage: test
  image: golang:1.26-alpine
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    TESTCONTAINERS_RYUK_DISABLED: "false"
  before_script:
    - apk add --no-cache docker-cli
  script:
    - go test ./test/... -v -count=1 -timeout 120s
  allow_failure: false

# ── build ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  script:
    - go build -trimpath -o mcp-postgres ./cmd/mcp-postgres
  artifacts:
    paths:
      - mcp-postgres
    expire_in: 1 week

docker:
  stage: build
  image: docker:27-alpine
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── release ───────────────────────────────────────────────────────────────────

docker-tag-latest:
  stage: release
  image: docker:27-alpine
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$IMAGE"
    - docker tag "$IMAGE" "$LATEST"
    - docker push "$LATEST"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

services:
  mcp-postgres:
    build: .
    ports:
      - "3000:3000"
    environment:
      PG_ADMIN_USER: ${PG_ADMIN_USER}
      PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD}
      MCP_CONFIG_PATH: /app/config/config.yaml
      LOG_LEVEL: info
    volumes:
      - ./config:/app/config:ro
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mcp-postgres", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
